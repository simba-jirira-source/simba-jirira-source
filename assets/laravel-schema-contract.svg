<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="lsc-title lsc-desc">
  <title id="lsc-title">Laravel Schema Contract</title>
  <desc id="lsc-desc">Detect schema and Eloquent cast inconsistencies. PHP 8.3+, Laravel 13, SQLite, MySQL, PostgreSQL, CI-backed.</desc>

  <defs>
    <linearGradient id="lsc-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" rx="14" fill="#1e293b"/>
  <rect x="1" y="1" width="1198" height="218" rx="13" fill="none" stroke="#334155" stroke-width="1"/>
  <rect x="0" y="0" width="4" height="220" rx="2" fill="url(#lsc-accent)"/>

  <text x="40" y="58" fill="#f8fafc" font-family="Instrument Sans, Inter, Segoe UI, system-ui, sans-serif" font-size="30" font-weight="700">Laravel Schema Contract</text>

  <text x="40" y="96" fill="#94a3b8" font-family="Instrument Sans, Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="400">Detect schema &#8596; Eloquent cast inconsistencies.</text>

  <text x="40" y="142" fill="#f8fafc" font-family="Instrument Sans, Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="500">PHP 8.3+</text>
  <text x="130" y="142" fill="#94a3b8" font-family="Instrument Sans, Inter, Segoe UI, system-ui, sans-serif" font-size="14">&#183;</text>
  <text x="148" y="142" fill="#f8fafc" font-family="Instrument Sans, Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="500">Laravel 13</text>
  <text x="250" y="142" fill="#94a3b8" font-family="Instrument Sans, Inter, Segoe UI, system-ui, sans-serif" font-size="14">&#183;</text>
  <text x="268" y="142" fill="#f8fafc" font-family="Instrument Sans, Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="500">SQLite &#183; MySQL &#183; PostgreSQL</text>
  <text x="520" y="142" fill="#94a3b8" font-family="Instrument Sans, Inter, Segoe UI, system-ui, sans-serif" font-size="14">&#183;</text>
  <text x="538" y="142" fill="#38bdf8" font-family="Instrument Sans, Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="500">CI-backed</text>

  <text x="40" y="186" fill="#3b82f6" font-family="Instrument Sans, Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600">View Repository &#8594;</text>

  <g opacity="0.35" fill="none" stroke="#334155" stroke-width="1">
    <rect x="980" y="48" width="160" height="100" rx="8"/>
    <line x1="1000" y1="78" x2="1120" y2="78"/>
    <line x1="1000" y1="98" x2="1080" y2="98"/>
    <line x1="1000" y1="118" x2="1100" y2="118"/>
  </g>
</svg>
