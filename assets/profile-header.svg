<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Simba Jirira</title>
  <desc id="hero-desc">Laravel Developer, Open-Source Package Maintainer, PHP Application Architect</desc>

  <defs>
    <linearGradient id="brand-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="blue-glow" cx="78%" cy="22%" r="42%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-glow" cx="92%" cy="78%" r="35%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="16" fill="#0f172a"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#blue-glow)"/>
  <rect width="1200" height="300" rx="16" fill="url(#cyan-glow)"/>
  <rect x="1" y="1" width="1198" height="298" rx="15" fill="none" stroke="#334155" stroke-width="1"/>

  <rect x="32" y="32" width="1136" height="236" rx="12" fill="#1e293b" fill-opacity="0.72"/>
  <rect x="32" y="32" width="1136" height="236" rx="12" fill="none" stroke="#334155" stroke-width="1"/>

  <rect x="32" y="32" width="5" height="236" rx="2.5" fill="url(#brand-line)"/>
  <rect x="56" y="56" width="140" height="3" rx="1.5" fill="url(#brand-line)" opacity="0.9"/>

  <g fill="none" stroke="#334155" stroke-width="1" opacity="0.75">
    <circle cx="1040" cy="88" r="5" fill="#3b82f6" fill-opacity="0.45" stroke="#3b82f6"/>
    <circle cx="1096" cy="118" r="4" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8"/>
    <circle cx="1136" cy="82" r="3.5" fill="none"/>
    <line x1="1040" y1="88" x2="1096" y2="118"/>
    <line x1="1096" y1="118" x2="1136" y2="82"/>
    <line x1="1040" y1="88" x2="1136" y2="82" stroke-dasharray="4 5" opacity="0.55"/>
  </g>

  <g opacity="0.4" fill="none" stroke="#38bdf8" stroke-width="1.2">
    <path d="M980 210 L1004 210 L1016 222"/>
    <path d="M980 228 L992 228"/>
  </g>

  <text x="56" y="118" fill="#f8fafc" font-family="Instrument Sans, Inter, Segoe UI, system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.2">Simba Jirira</text>

  <text x="56" y="162" fill="#3b82f6" font-family="Instrument Sans, Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600">Laravel Developer · Open-Source Package Maintainer · PHP Application Architect</text>

  <text x="56" y="198" fill="#94a3b8" font-family="Instrument Sans, Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="400">Building maintainable applications, packages and developer tooling.</text>

  <circle cx="72" cy="232" r="3" fill="#38bdf8" opacity="0.65"/>
  <circle cx="88" cy="232" r="3" fill="#3b82f6" opacity="0.45"/>
  <circle cx="104" cy="232" r="3" fill="#334155"/>
