<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 176" role="img" aria-labelledby="profile-title profile-desc">
  <title id="profile-title">Simba Jirira</title>
  <desc id="profile-desc">Laravel Developer, Open-Source Package Maintainer, PHP Application Architect</desc>

  <defs>
    <linearGradient id="brand-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow-spot" cx="85%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Surface -->
  <rect width="720" height="176" rx="14" fill="#0f172a"/>
  <rect width="720" height="176" rx="14" fill="url(#grid)"/>
  <rect width="720" height="176" rx="14" fill="url(#glow-spot)"/>
  <rect x="1" y="1" width="718" height="174" rx="13" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Elevated panel -->
  <rect x="20" y="20" width="680" height="136" rx="10" fill="#1e293b" fill-opacity="0.55"/>
  <rect x="20" y="20" width="680" height="136" rx="10" fill="url(#brand-glow)"/>

  <!-- Architecture nodes -->
  <g fill="none" stroke="#334155" stroke-width="1" opacity="0.7">
    <circle cx="598" cy="52" r="4" fill="#3b82f6" fill-opacity="0.5" stroke="#3b82f6"/>
    <circle cx="638" cy="72" r="3" fill="#38bdf8" fill-opacity="0.4" stroke="#38bdf8"/>
    <circle cx="668" cy="48" r="3" fill="none" stroke="#334155"/>
    <line x1="598" y1="52" x2="638" y2="72"/>
    <line x1="638" y1="72" x2="668" y2="48"/>
    <line x1="598" y1="52" x2="668" y2="48" stroke-dasharray="3 4" opacity="0.5"/>
  </g>

  <!-- Code-inspired accent -->
  <g opacity="0.45" fill="none" stroke="#38bdf8" stroke-width="1">
    <path d="M562 118 L578 118 L586 126"/>
    <path d="M562 130 L570 130"/>
  </g>

  <!-- Accent bar -->
  <rect x="20" y="20" width="4" height="136" rx="2" fill="url(#accent-line)"/>
  <rect x="40" y="36" width="96" height="2" rx="1" fill="url(#accent-line)" opacity="0.85"/>

  <!-- Name -->
  <text x="40" y="72" fill="#f8fafc" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.6">Simba Jirira</text>

  <!-- Role -->
  <text x="40" y="98" fill="#3b82f6" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.2">Laravel Developer · Open-Source Package Maintainer · PHP Application Architect</text>

  <!-- Tagline -->
  <text x="40" y="122" fill="#94a3b8" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400">Building maintainable applications, packages and developer tooling.</text>

  <!-- Decorative dots -->
  <circle cx="52" cy="142" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="64" cy="142" r="2" fill="#3b82f6" opacity="0.4"/>
  <circle cx="76" cy="142" r="2" fill="#334155"/>
</svg>
