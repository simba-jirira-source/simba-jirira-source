<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 168" role="img" aria-labelledby="profile-title profile-desc">
  <title id="profile-title">Simba Jirira</title>
  <desc id="profile-desc">Laravel Developer, Open-Source Package Maintainer, PHP Application Architect</desc>

  <defs>
    <linearGradient id="accent-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2D20" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF2D20" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="680" height="168" rx="12" fill="#0D1117"/>
  <rect x="1" y="1" width="678" height="166" rx="11" fill="none" stroke="#30363D" stroke-width="1"/>

  <!-- Laravel red accent bar -->
  <rect x="0" y="0" width="4" height="168" rx="2" fill="#FF2D20"/>
  <rect x="24" y="20" width="120" height="3" rx="1.5" fill="url(#accent-fade)"/>

  <!-- Subtle geometric decoration -->
  <g fill="none" stroke="#21262D" stroke-width="1" opacity="0.8">
    <path d="M620 28 L652 28 L652 60"/>
    <path d="M636 44 L668 44 L668 76"/>
    <circle cx="648" cy="88" r="3" fill="#30363D" stroke="none"/>
  </g>

  <!-- Name -->
  <text x="28" y="58" fill="#F6F8FA" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">Simba Jirira</text>

  <!-- Role lines -->
  <text x="28" y="88" fill="#FF2D20" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" letter-spacing="0.3">Laravel Developer</text>
  <text x="28" y="108" fill="#C9D1D9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">Open-Source Package Maintainer</text>
  <text x="28" y="128" fill="#C9D1D9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">PHP Application Architect</text>

  <!-- Tagline -->
  <text x="28" y="152" fill="#8B949E" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="400">Building maintainable Laravel applications, packages &amp; developer tooling.</text>
</svg>
